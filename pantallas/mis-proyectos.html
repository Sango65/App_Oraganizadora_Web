 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUIO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0" integrity="sha384-UagCvVPT5XXA0Hx+nJYUAGBFseHT9zBgpJMSebsAxl9lciTwbT+39j5VfRjdP5Tp" crossorigin="anonymous"></script>
    <script src="../JS/supabase.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="icon" type="image/png" href="../images/Logo.png">
</head>
<body class="bg-gray-900 min-h-screen flex flex-col">

    <!-- header -->
    <div class="p-4 pb-2">
    <div id="btnCerrarSesion" class="flex items-center gap-2 mb-3 cursor-pointer w-fit">
        <i class="ti ti-user-circle text-gray-400 text-2xl"></i>
        <span id="nombreUsuarioHeader" class="text-gray-400 text-base">Usuario</span>
    </div>
        <div class="flex items-center gap-2">
            <h1 class="text-white text-2xl font-semibold">Mis proyectos</h1>
            <i class="ti ti-folder text-gray-400 text-xl"></i>
        </div>
    </div>
    
    <!-- Contadores de proyectos -->
    <div class="flex gap-3 px-4 mb-4">
        <div class="flex-1 bg-gray-800 rounded-2xl p-2">
            <i class="ti ti-circle-check text-green-500 text-base"></i>
            <p id="contadorTerminados" class="text-white text-lg font-bold mt-0.5">0</p>
            <p class="text-gray-400 text-[10px] uppercase leading-tight">Proyectos terminados</p>
        </div>
        <div class="flex-1 bg-gray-800 rounded-2xl p-2">
            <i class="ti ti-clock text-red-500 text-base"></i>
            <p id="contadorEnCurso" class="text-white text-lg font-bold mt-0.5">0</p>
            <p class="text-gray-400 text-[10px] uppercase leading-tight">Proyectos en curso</p>
        </div>
    </div>

    <!-- contenido (lista de proyectos) -->
    <div class="flex-1 px-4 pb-20">
        <div id="estadoVacio" class="flex flex-col items-center justify-center h-full text-center px-6">
            <i class="ti ti-folder-open text-gray-600 text-5xl mb-4"></i>
            <h2 class="text-white font-semibold mb-2">Aún no tienes proyectos</h2>
            <p class="text-gray-400 text-sm">Crea tu primer proyecto.</p>
        </div>
        
        <div id="listaProyectos" class="space-y-3 hidden">
            <!-- Este div se llena dinámicamente desde proyectos.js -->
        </div>
    </div>

     <!-- tab-bar-inferior -->
      <nav class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 flex justify-around py-2">
        <a href="mis-proyectos.html" class="flex flex-col items-center text-red-500">
            <i class="ti ti-folder text-xl"></i>
            <span class="text-xs mt-1">Proyectos</span>
        </a>
        <a href="guia-tareas.html" class="flex flex-col items-center text-gray-400">
            <i class="ti ti-list-check text-xl"></i>
            <span class="text-xs mt-1">Guía</span>
        </a>
        <a href="acerca-de.html" class="flex flex-col items-center text-gray-400">
            <i class="ti ti-info-circle text-xl"></i>
            <span class="text-xs mt-1">Acerca de</span>
        </a>
      </nav>

      <button id="btnNuevoProyecto" class="fixed bottom-20 right-4 w-14 h-14 bg-red-500 hover:bg-red-600 rounded-full flex items-center justify-center shadow-lg cursor-grab active:cursor-grabbing touch-none">
        <i class="ti ti-plus text-white text-2xl"></i>
      </button>

      <!-- Modal: Nuevo proyecto (oculto por defecto) -->
        <div id="modalNuevoProyecto" class="fixed inset-0 bg-black bg-opacity-50 hidden items-end justify-center z-50">
            <div class="w-full max-w-sm bg-gray-800 rounded-t-2xl p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-white font-semibold">Nuevo proyecto</h2>
                    <i class="ti ti-x text-gray-400 cursor-pointer" id="btnCerrarModal"></i>
                </div>

                <label for="inputNombreProyecto" class="text-gray-400 text-xs uppercase tracking-wide">Nombre del proyecto</label>
                <input type="text" id="inputNombreProyecto" placeholder="Ej. Proyecto final" class="w-full bg-gray-900 text-white text-sm rounded-lg px-3 py-2 mt-1 mb-3 outline-none">

                <label for="inputDesarrolladoPor" class="text-gray-400 text-xs uppercase tracking-wide">Estudiante/s</label>
                <input type="text" id="inputDesarrolladoPor" placeholder="Ej. Nombre del equipo" class="w-full bg-gray-900 text-white text-sm rounded-lg px-3 py-2 mt-1 mb-3 outline-none">

                <label for="inputMateria" class="text-gray-400 text-xs uppercase tracking-wide">Materia/Asignatura</label>
                <input type="text" id="inputMateria" placeholder="Ej. Nombre de la materia/asignatura" class="w-full bg-gray-900 text-white text-sm rounded-lg px-3 py-2 mt-1 mb-3 outline-none">

                <label for="inputFechaLimite" class="text-gray-400 text-xs uppercase tracking-wide">Fecha límite de entrega</label>
                <input type="date" id="inputFechaLimite" class="w-full bg-gray-900 text-white text-sm rounded-lg px-3 py-2 mt-1 mb-3 outline-none [color-scheme:dark]">
                
                <div class="flex gap-2">
                    <button id="btnCancelarProyecto" class="flex-1 bg-gray-700 text-white py-2 rounded-xl">Cancelar</button>
                    <button id="btnCrearProyecto" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2 rounded-xl">Crear</button>
                </div>
            </div>
        </div>

        <!-- Modal: Editar proyecto (oculto por defecto) -->
        <div id="modalEditar" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center z-50">
            <div class="w-full max-w-sm mx-4 bg-gray-800 rounded-2xl p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-white font-semibold">Editar proyecto</h2>
                    <i class="ti ti-x text-gray-400 cursor-pointer" id="btnCerrarModalEditar"></i>
                </div>

                <label for="inputEditarNombre" class="text-gray-400 text-xs uppercase tracking-wide">Cambiar nombre del proyecto</label>
                <input type="text" id="inputEditarNombre" class="w-full bg-gray-900 text-white text-sm rounded-lg px-3 py-2 mt-1 mb-3 outline-none">

                <label for="inputEditarDesarrolladoPor" class="text-gray-400 text-xs uppercase tracking-wide">Cambiar estudiante/s</label>
                <input type="text" id="inputEditarDesarrolladoPor" class="w-full bg-gray-900 text-white text-sm rounded-lg px-3 py-2 mt-1 mb-3 outline-none">

                <label for="inputEditarMateria" class="text-gray-400 text-xs uppercase tracking-wide">Cambiar materia/asignatura</label>
                <input type="text" id="inputEditarMateria" class="w-full bg-gray-900 text-white text-sm rounded-lg px-3 py-2 mt-1 mb-3 outline-none">

                <label for="inputEditarFechaLimite" class="text-gray-400 text-xs uppercase tracking-wide">Cambiar fecha límite de entrega</label>
                <input type="date" id="inputEditarFechaLimite" class="w-full bg-gray-900 text-white text-sm rounded-lg px-3 py-2 mt-1 mb-4 outline-none">

                <div class="flex gap-2">
                    <button id="btnCancelarEditar" class="flex-1 bg-gray-700 text-white py-2 rounded-xl">Cancelar</button>
                    <button id="btnConfirmarEditar" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2 rounded-xl">Guardar cambios</button>
                </div>
            </div>
        </div>

        <!-- Modal: Confirmar cierre de sesión (oculto por defecto) -->
        <div id="modalCerrarSesion" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center z-50">
            <div class="w-full max-w-sm mx-4 bg-gray-800 rounded-2xl p-5">
                <h2 class="text-white font-semibold mb-2">Cerrar sesión</h2>
                <p class="text-gray-400 text-sm mb-5">¿Estás seguro que deseas cerrar sesión?</p>

                <div class="flex gap-2">
                    <button id="btnCancelarCerrarSesion" class="flex-1 bg-gray-700 text-white py-2 rounded-xl">Cancelar</button>
                    <button id="btnConfirmarCerrarSesion" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2 rounded-xl">Cerrar sesión</button>
                </div>
            </div>
        </div>
    <output id="indicadorCarga" class="hidden fixed inset-0 z-[100] items-center justify-center bg-gray-900/80" aria-live="polite" aria-label="Cargando pantalla">
        <div class="h-12 w-12 animate-spin rounded-full border-4 border-gray-700 border-t-red-500"></div>
    </output>
    <script src="../JS/utilidades.js"></script>
    <script src="../JS/sesion.js"></script>
    <script src="../JS/proyectos.js"></script>
</body>
</html>
