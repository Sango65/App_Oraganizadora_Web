<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUIO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../JS/supabase.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">

        <!-- Logo -->
        <div class="flex justify-center mb-4">
            <div class="flex justify-center mb-4">
                <img src="../images/Logo.png" alt="Logo de Guio" class="w-16 h-auto">
            </div>
        </div>

        <div class="text-center mb-6">
            <h1 class="text-white text-xl font-semibold">Bienvenido</h1>
            <p class="text-gray-400 text-sm mt-1">Organiza tus proyectos con éxito</p>
        </div>

        <!-- Campo: correo -->
        <div class="bg-gray-800 rounded-2xl p-4 mb-4">
            <label class="text-gray-400 text-xs uppercase tracking-wide">Correo Electronico</label>
            <div class="mt-1 flex items-center bg-gray-900 rounded-lg px-3 py-2">
                <i class="ti ti-mail text-gray-500 mr-2"></i>
                <input type="email" placeholder="email.usuario@gmail.com" class="bg-transparent text-white text-sm w-full outline-none placeholder-gray-500">
            </div>
        </div>

        <!-- Campo: nombre de usuario -->
        <div class="bg-gray-800 rounded-2xl p-4 mb-4">
            <label class="text-gray-400 text-xs uppercase tracking-wide">Nombre de usuario</label>
            <div class="mt-1 flex items-center bg-gray-900 rounded-lg px-3 py-2">
                <i class="ti ti-user text-gray-500 mr-2"></i>
                <input type="text" placeholder="Usuario" class="bg-transparent text-white text-sm w-full outline-none placeholder-gray-500">
            </div>
        </div>

        <!-- Campo: contraseña (con botón de mostrar/ocultar) -->
        <div class="bg-gray-800 rounded-2xl p-4 mb-4">
            <label class="text-gray-400 text-xs uppercase tracking-wide">Contraseña</label>
            <div class="mt-1 flex items-center bg-gray-900 rounded-lg px-3 py-2">
                <i class="ti ti-lock text-gray-500 mr-2"></i>
                <input type="password" id="inputContraseña" placeholder="......" class="bg-transparent text-white text-sm w-full outline-none placeholder-gray-500">
                <i class="ti ti-eye text-gray-500 ml-2 cursor-pointer" id="iconoOjo" onclick="toggleContraseña('inputContraseña', 'iconoOjo')"></i>
            </div>
            <div class="mt-2 space-y-1">
                <p id="reqLongitud" class="text-gray-500 text-xs flex items-center gap-1">
                    <i class="ti ti-circle text-xs"></i> Mínimo 8 caracteres
                </p>
                <p id="reqLetras" class="text-gray-500 text-xs flex items-center gap-1">
                    <i class="ti ti-circle text-xs"></i> Al menos una letra
                </p>
                <p id="reqNumeros" class="text-gray-500 text-xs flex items-center gap-1">
                    <i class="ti ti-circle text-xs"></i> Al menos un número
                </p>
            </div>
        </div>

        <!-- Envía el registro, lógica en auth.js -->
        <button id="btnRegistrarse" class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2 mt-2">
            Registrarse
            <i class="ti ti-user-plus"></i>
        </button>
        <p class="text-center text-gray-400 text-sm mt-4">
            ¿Ya tienes una cuenta?
            <a href="log-in.html" class="text-red-500 font-semibold">Inicia sesion</a>
        </p>
    </div>
</body>
<script src="../JS/auth.js"></script>
</html>
